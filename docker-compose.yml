services:
  fluffy-sniffle:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluffy-sniffle:latest
    container_name: fluffy-sniffle
    restart: unless-stopped
    ports:
      # Bind strictly to host loopback interface (127.0.0.1) to prevent LAN exposure
      - "127.0.0.1:3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
      - DASHBOARD_READONLY=${DASHBOARD_READONLY:-false}
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY:-}
      - DASHBOARD_REQUIRE_AUTH=${DASHBOARD_REQUIRE_AUTH:-false}
      - ENABLE_DISK_CACHE=${ENABLE_DISK_CACHE:-false}
      - ENABLE_DISK_REPORTS=${ENABLE_DISK_REPORTS:-false}
      # GitHub Personal Access Token (loaded from .env if present)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      # Mount config.json so configuration changes reflect without rebuilding
      - ./config.json:/app/config.json
